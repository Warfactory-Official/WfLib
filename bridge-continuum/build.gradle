plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = neo_version
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly files(wflib_jar, golem_jar, hbm_jar)
}

// neoforge.mods.toml carries the version
tasks.processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: mod_version) }
}
