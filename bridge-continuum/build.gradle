plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal { content { includeGroup 'warfactory.ultimateweight' } }
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Warfactory Snapshots'; url = 'https://repo.warfactory.co/snapshots'; content { includeGroup 'com.wf.gemrender'; includeGroup 'com.norwood' } }
}

neoForge {
    version = neo_version
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly files(wflib_jar, golem_jar, hbm_jar)
    compileOnly("com.wf.gemrender:gemrender-1.21.1:[0.1.22-SNAPSHOT,1)") { transitive = false }
    compileOnly("com.norwood:ahf-1.21.1-neoforge:1.0.10-SNAPSHOT") { transitive = false }   // the bent elbows of Continuum's armour arms; optional at run time   // the floodlights' spot lights; wflib carries it at run time
    compileOnly("warfactory.ultimateweight:wfweight-1.21.1-neoforge:1.0.0-SNAPSHOT") { transitive = false }
}

// neoforge.mods.toml carries the version
tasks.processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: mod_version) }
}
