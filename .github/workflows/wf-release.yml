name: WF Rolling Release

on:
  push:
    tags: ['wf']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Zig
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon

      - name: Stage jar
        run: |
          SRC=$(find build/libs -maxdepth 1 -name 'wflib-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          cp "$SRC" wflib.jar

      - name: Publish wf release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wf --yes --cleanup-tag || true
          gh release create wf wflib.jar \
            --title "WF rolling release" \
            --notes "Rolling pack release. Triggered by wf tag." \
            --latest
